[project]
name = "ia-dev-template"
version = "0.1.0"
description = "Template diplomado IA aplicado al desarrollo de software (FastAPI + Mock LLM + Agentes)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  "httpx>=0.26.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.31.0",
]
llm = [
  "openai>=2.17.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.2",
  "coverage>=7,<8",
]

[tool.ruff]
line-length = 88
